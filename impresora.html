<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impresora — BamBam Consultora Informática</title>
<meta name="description" content="Ficha técnica y galería de fotos de las impresoras de credenciales que vende BamBam en Formosa.">
<meta name="theme-color" content="#0b1c2c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b1c2c'/><text x='16' y='23' text-anchor='middle' font-family='Arial,sans-serif' font-weight='800' font-size='18' fill='%2314b8c9'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --ink: #0b1c2c;
        --ink-soft: #14283c;
        --paper: #f4f7f9;
        --panel: #ffffff;
        --line: #e2e8ee;
        --text: #1b2836;
        --text-soft: #5b6b7c;
        --cyan: #0fb7c4;
        --cyan-dark: #0a8f99;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--ink); line-height: 1.14; letter-spacing: -0.01em; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ul { list-style: none; }
    button { font-family: inherit; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 26px; border-radius: 9px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; }
    .btn-cyan { background: var(--cyan); color: #06282b; }
    .btn-cyan:hover { background: var(--cyan-dark); color: #fff; }
    .btn-outline-ink { border-color: var(--line); color: var(--ink); background: var(--panel); }
    .btn-outline-ink:hover { border-color: var(--cyan); color: var(--cyan-dark); }
    .btn-wa { background: #25D366; color: #fff; }
    .btn-wa:hover { background: #1fb355; }
    .btn-sm { padding: 10px 18px; font-size: 0.82rem; }
    .btn-block { width: 100%; }

    /* ---------- NAV ---------- */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: 20px 0; background: rgba(11,28,44,0.96); backdrop-filter: blur(10px); }
    nav.container { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.32rem; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .logo span { color: var(--cyan); }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a:not(.btn) { color: rgba(255,255,255,0.82); font-size: 0.85rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a:not(.btn):hover { color: var(--cyan); }
    .burger { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .nav-links.open {
        display: flex; position: fixed; top: 62px; left: 0; right: 0; bottom: 0;
        background: rgba(11,28,44,0.98); flex-direction: column; padding: 28px; gap: 22px;
        backdrop-filter: blur(10px); text-align: center; z-index: 499; overflow-y: auto;
    }

    /* ---------- FICHA ---------- */
    main { padding: 116px 0 90px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 600; color: var(--text-soft); margin-bottom: 28px; }
    .back-link:hover { color: var(--cyan-dark); }
    .back-link i { transition: transform 0.2s ease; }
    .back-link:hover i { transform: translateX(-3px); }

    .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }

    .gallery-main { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 26px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .gallery-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); box-shadow: 0 8px 20px rgba(11,28,44,0.12); }
    .gallery-nav:hover { border-color: var(--cyan); color: var(--cyan-dark); }
    .gallery-prev { left: -18px; }
    .gallery-next { right: -18px; }
    .gallery-thumbs { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .gallery-thumb { width: 68px; height: 68px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); padding: 6px; cursor: pointer; transition: all 0.15s ease; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .gallery-thumb.active { border-color: var(--cyan); }
    .gallery-thumb:hover { border-color: var(--cyan-dark); }
    .gallery-count { position: absolute; bottom: 16px; right: 16px; background: rgba(11,28,44,0.85); color: #fff; font-size: 0.74rem; font-weight: 600; padding: 5px 11px; border-radius: 980px; }

    .p-brand { font-size: 0.8rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--cyan-dark); margin-bottom: 6px; }
    .p-title { font-size: clamp(1.9rem, 3.4vw, 2.5rem); margin-bottom: 12px; }
    .p-badge { display: inline-block; background: var(--ink); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 5px 12px; border-radius: 980px; margin-bottom: 18px; }
    .p-desc { color: var(--text-soft); font-size: 1rem; margin-bottom: 26px; }

    .p-specs { display: grid; gap: 12px; margin-bottom: 28px; }
    .p-specs li { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 0.9rem; }
    .p-specs i { color: var(--cyan-dark); width: 18px; margin-top: 2px; text-align: center; flex-shrink: 0; }
    .p-specs b { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-soft); font-weight: 700; margin-bottom: 2px; }

    .p-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .p-note { margin-top: 18px; font-size: 0.84rem; color: var(--text-soft); }

    /* ---------- OTRAS IMPRESORAS ---------- */
    .others { margin-top: 90px; padding-top: 56px; border-top: 1px solid var(--line); }
    .others h2 { font-size: 1.5rem; margin-bottom: 24px; }
    .others-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .other-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: all 0.2s ease; }
    .other-card:hover { border-color: var(--cyan); transform: translateY(-3px); }
    .other-photo { aspect-ratio: 1/1; background: #fff; padding: 14px; border-bottom: 1px solid var(--line); }
    .other-photo img { width: 100%; height: 100%; object-fit: contain; }
    .other-body { padding: 14px 16px 16px; }
    .other-brand { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cyan-dark); }
    .other-name { font-size: 0.94rem; font-weight: 700; color: var(--ink); }

    /* ---------- FOOTER ---------- */
    footer { background: #081422; color: rgba(244,247,249,0.5); padding: 34px 0 22px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 90px; }
    .footer-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 0.78rem; }
    .footer-bottom a { color: var(--cyan); }
    .footer-bottom a:hover { text-decoration: underline; }

    .wa-float { position: fixed; bottom: 26px; right: 26px; z-index: 400; width: 58px; height: 58px; border-radius: 50%; background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 12px 28px rgba(0,0,0,0.28); }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 980px) {
        .sheet { grid-template-columns: 1fr; gap: 34px; }
        .others-grid { grid-template-columns: 1fr 1fr; }
        .nav-links { display: none; }
        .burger { display: block; }
        .gallery-nav { display: none; }
    }
    @media (max-width: 640px) {
        .container { padding: 0 20px; }
        main { padding: 96px 0 64px; }
        .p-actions .btn { flex: 1 1 100%; }
        .others { margin-top: 56px; padding-top: 40px; }
        .others-grid { grid-template-columns: 1fr 1fr; }
        .footer-bottom { flex-direction: column; }
    }
</style>
</head>
<body>

<header id="siteHeader">
    <nav class="container">
        <a href="index.html#inicio" class="logo">Bam<span>Bam</span></a>
        <div class="nav-links" id="navLinks">
            <a href="index.html#servicios">Servicios</a>
            <a href="index.html#impresoras">Impresoras</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="index.html#contacto">Contacto</a>
            <a href="https://wa.me/5493704824319?text=Hola%20BamBam%2C%20quiero%20hacer%20una%20consulta" target="_blank" class="btn btn-cyan btn-sm"><i class="fa-brands fa-whatsapp"></i> Escribinos</a>
        </div>
        <button class="burger" id="burgerBtn" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
    </nav>
</header>

<main class="container">
    <a href="index.html#impresoras" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver a impresoras</a>

    <div class="sheet" id="sheet"></div>

    <div class="others">
        <h2>Otras impresoras</h2>
        <div class="others-grid" id="othersGrid"></div>
    </div>
</main>

<footer>
    <div class="container footer-bottom">
        <span>© 2026 BamBam Consultora Informática · Formosa, Argentina.</span>
        <span><a href="https://wa.me/5493704824319" target="_blank">WhatsApp</a> · <a href="#" target="_blank">Instagram</a></span>
    </div>
</footer>

<a href="https://wa.me/5493704824319?text=Hola%20BamBam%2C%20quiero%20hacer%20una%20consulta" target="_blank" class="wa-float" aria-label="Consultar por WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script src="bambam-data.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const printer = getPrinter(id);

if (!printer) {
    location.replace('index.html#impresoras');
} else {
    document.title = `${printer.brand} ${printer.name} — BamBam Consultora Informática`;
    document.querySelector('meta[name="description"]').content = `${printer.brand} ${printer.name}: ${printer.desc}`;

    let current = 0;
    const imgs = printer.images;

    document.getElementById('sheet').innerHTML = `
        <div>
            <div class="gallery-main">
                ${imgs.length > 1 ? '<button class="gallery-nav gallery-prev" id="galPrev" aria-label="Foto anterior"><i class="fa-solid fa-chevron-left"></i></button>' : ''}
                <img id="galMain" src="${imgs[0]}" alt="${printer.brand} ${printer.name}">
                ${imgs.length > 1 ? '<button class="gallery-nav gallery-next" id="galNext" aria-label="Foto siguiente"><i class="fa-solid fa-chevron-right"></i></button>' : ''}
                ${imgs.length > 1 ? `<span class="gallery-count" id="galCount">1 / ${imgs.length}</span>` : ''}
            </div>
            ${imgs.length > 1 ? `<div class="gallery-thumbs" id="galThumbs">${imgs.map((src, i) => `<button class="gallery-thumb ${i === 0 ? 'active' : ''}" data-i="${i}"><img src="${src}" alt="Foto ${i + 1} de ${printer.name}"></button>`).join('')}</div>` : ''}
        </div>
        <div>
            <div class="p-brand">${printer.brand}</div>
            <h1 class="p-title">${printer.name}</h1>
            <span class="p-badge">${printer.badge}</span>
            <p class="p-desc">${printer.desc}</p>
            <ul class="p-specs">
                ${printer.specs.map(s => `<li><i class="fa-solid ${s.icon}"></i><div><b>${s.label}</b>${s.value}</div></li>`).join('')}
            </ul>
            <div class="p-actions">
                <a class="btn btn-wa" href="${waLink('Hola BamBam, quiero consultar precio y stock de la impresora ' + printer.brand + ' ' + printer.name)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Consultar esta impresora</a>
                <a class="btn btn-outline-ink" href="mailto:ventas@bambaminformatica.com.ar?subject=${encodeURIComponent('Consulta: ' + printer.brand + ' ' + printer.name)}"><i class="fa-solid fa-envelope"></i> Escribir un email</a>
            </div>
            <p class="p-note">Precio a cotizar según disponibilidad e importación. Te respondemos con el valor actualizado.</p>
        </div>
    `;

    function showImage(i) {
        current = (i + imgs.length) % imgs.length;
        document.getElementById('galMain').src = imgs[current];
        const count = document.getElementById('galCount');
        if (count) count.textContent = `${current + 1} / ${imgs.length}`;
        document.querySelectorAll('.gallery-thumb').forEach((t, k) => t.classList.toggle('active', k === current));
    }
    if (imgs.length > 1) {
        document.getElementById('galPrev').addEventListener('click', () => showImage(current - 1));
        document.getElementById('galNext').addEventListener('click', () => showImage(current + 1));
        document.getElementById('galThumbs').addEventListener('click', (e) => {
            const t = e.target.closest('.gallery-thumb');
            if (t) showImage(Number(t.dataset.i));
        });
    }

    document.getElementById('othersGrid').innerHTML = PRINTERS.filter(p => p.id !== printer.id).map(p => `
        <a class="other-card" href="impresora.html?id=${p.id}">
            <div class="other-photo"><img src="${p.images[0]}" alt="${p.brand} ${p.name}" loading="lazy"></div>
            <div class="other-body"><div class="other-brand">${p.brand}</div><div class="other-name">${p.name}</div></div>
        </a>
    `).join('');
}

/* ---------- MENÚ MÓVIL ---------- */
const burger = document.getElementById('burgerBtn');
const navLinks = document.getElementById('navLinks');
burger.addEventListener('click', () => navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
</script>

</body>
</html>
